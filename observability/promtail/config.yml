# https://grafana.com/docs/loki/latest/clients/promtail/configuration/
# https://docs.docker.com/engine/api/v1.41/#operation/ContainerList
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: container_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["logging=promtail"] 
    relabel_configs:
      # Extract container name (remove leading slash)
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      
      # Add log stream info
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'logstream'
      
      # Use custom job name from container label
      - source_labels: ['__meta_docker_container_label_logging_jobname']
        target_label: 'job'
      
      # Add stack name from label
      - source_labels: ['__meta_docker_container_label_stackname']
        target_label: 'stack'
      
      # Add container image info
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      
    pipeline_stages:
      - cri: {}
      - multiline:
          firstline: ^\d{4}-\d{2}-\d{2} \d{1,2}:\d{2}:\d{2},\d{3}
          max_wait_time: 3s

      - json:
          expressions:
            level: level
            logger: logger
            thread: thread
            message: message
            trace_id: traceId
            span_id: spanId