# Application Configuration
spring.application.name=backend
spring.data.rest.base-path=/api

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-container:3306/mydatabase}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# AWS RDS Configuration (commented out)
# spring.datasource.url=jdbc:mysql://testclouddb.cxyiw0egiwdj.eu-west-1.rds.amazonaws.com:3306/hbdb
# spring.datasource.username=testhb
# spring.datasource.password=dbPassword

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Connection Pooling Configuration
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# Management & Observability Configuration
# ===============================
# Actuator endpoints
management.endpoints.web.exposure.include=health,prometheus,metrics,info,env
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true

# Health checks for Kubernetes/Docker
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Prometheus metrics configuration
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${MANAGEMENT_METRICS_TAGS_APPLICATION:backend}
management.metrics.tags.service=backend
management.metrics.tags.environment=${ENVIRONMENT:docker}

# HTTP request metrics with percentiles
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms,500ms

# JVM and system metrics
management.metrics.enable.jvm=true
management.metrics.enable.system=true
management.metrics.enable.process=true

# ===============================
# Logging Configuration
# ===============================
# Log levels
logging.level.com.contoso=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.io.opentelemetry=INFO
logging.level.io.micrometer=INFO

# Log pattern with trace correlation
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [traceId=%X{traceId:-}] [spanId=%X{spanId:-}] %logger{36} - %msg%n

# ===============================
# OpenTelemetry Configuration (Optional - otel.properties takes precedence)
# ===============================
# These can be overridden by environment variables or otel.properties
otel.service.name=${OTEL_SERVICE_NAME:backend}
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.resource.attributes=service.name=${OTEL_SERVICE_NAME:backend},service.version=1.0.0